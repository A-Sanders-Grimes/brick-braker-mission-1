<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Brick Breaker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🧱 Brick Breaker (DOM)</h1>
            <div id="marcador">Puntuación: 0</div>
        </header>

        <!-- Game Board using DOM elements -->
        <div id="gameBoard">
            <div id="ball"></div>
            <div id="paddle"></div>
            <div id="bricksContainer"></div>
            
            <div id="gameMessage" class="message-overlay hidden">
                <h2 id="messageText">¡Juego Terminado!</h2>
                <button id="restartBtn">Jugar de nuevo</button>
            </div>
        </div>

        <div class="instructions">
            <p>Usa las flechas <strong>Izquierda y Derecha</strong> (o A / D) para mover la plataforma.</p>
        </div>
    </div>
</body>
</html>
